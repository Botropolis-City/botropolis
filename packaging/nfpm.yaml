name: botropolis
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: utils
priority: optional
maintainer: Aria Vesta <dev@ariavesta.com>
description: |
  Every Claude Code session on this machine, drawn as a city.
  Districts are projects, buildings are sessions, and everything on the map
  means one thing you can read by hovering it.
vendor: Aria Vesta
homepage: https://botropolis.city
license: MIT AND OFL-1.1 AND CC0-1.0

# Ebitengine dlopens GL and X11, so the binary's only NEEDED entry is libc and no
# linker-based tool can see these. They are read off the sonames in the binary's
# string table instead.
#
# libXxf86vm and ALSA are deliberately absent. They are in the build headers CI
# installs, which is not the same as a runtime need: nothing references either,
# and botropolis has no audio. Requiring ALSA would make every user install a
# sound stack for a program that never opens one.
#
# ffmpeg is only suggested: sharing the city records a clip with it, says so
# when it is missing, and saves pictures and GIFs without it (item 168). The
# rpm names the file, which Fedora's ffmpeg-free and RPM Fusion's ffmpeg both
# provide. nfpm has no optional dependencies for Arch, so the Arch package
# says nothing.
overrides:
  deb:
    suggests:
      - ffmpeg
    depends:
      - libgl1
      - libx11-6
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxrandr2
      - hicolor-icon-theme
  rpm:
    suggests:
      - /usr/bin/ffmpeg
    depends:
      - mesa-libGL
      - libX11
      - libXcursor
      - libXi
      - libXinerama
      - libXrandr
      - hicolor-icon-theme
  archlinux:
    depends:
      - libgl
      - libx11
      - libxcursor
      - libxi
      - libxinerama
      - libxrandr
      - hicolor-icon-theme

contents:
  - src: ./bin/botropolis
    dst: /usr/bin/botropolis
    file_info: { mode: 0755 }
  - src: ./bin/botropolisd
    dst: /usr/bin/botropolisd
    file_info: { mode: 0755 }
  - src: ./bin/botropolis-hook
    dst: /usr/bin/botropolis-hook
    file_info: { mode: 0755 }

  - src: ./packaging/botropolisd.service
    dst: /usr/lib/systemd/user/botropolisd.service
  - src: ./packaging/botropolis-notify.service
    dst: /usr/lib/systemd/user/botropolis-notify.service

  - src: ./bin/completions/botropolis.bash
    dst: /usr/share/bash-completion/completions/botropolis
  - src: ./bin/completions/_botropolis
    dst: /usr/share/zsh/site-functions/_botropolis
  - src: ./bin/completions/botropolis.fish
    dst: /usr/share/fish/vendor_completions.d/botropolis.fish
  # make man writes botropolis(1), a page per command, botropolisd(1),
  # botropolis-hook(1) and botropolis-config(5) (item 167).
  - src: ./bin/man/*.1.gz
    dst: /usr/share/man/man1/
  - src: ./bin/man/*.5.gz
    dst: /usr/share/man/man5/
  - src: ./packaging/botropolis.bash
    dst: /usr/share/botropolis/botropolis.bash
  - src: ./packaging/botropolis.desktop
    dst: /usr/share/applications/botropolis.desktop
  - src: ./packaging/botropolis.svg
    dst: /usr/share/icons/hicolor/scalable/apps/botropolis.svg

  - src: ./README.md
    dst: /usr/share/doc/botropolis/README.md
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/botropolis/CHANGELOG.md

  # The atlases and the typeface are compiled into the binaries, so their
  # licences ship with the binaries rather than with the source tree.
  - src: ./LICENSE
    dst: /usr/share/licenses/botropolis/LICENSE
  - src: ./pkg/assets/fonts/inter/LICENSE.txt
    dst: /usr/share/licenses/botropolis/inter-OFL.txt
  - src: ./pkg/assets/kits/nature-kit/License.txt
    dst: /usr/share/licenses/botropolis/kenney-CC0.txt
  - src: ./pkg/assets/kits/README.md
    dst: /usr/share/licenses/botropolis/kenney-kits.md
  - src: ./pkg/assets/kenney/README.md
    dst: /usr/share/licenses/botropolis/kenney-packs.md

scripts:
  postinstall: ./packaging/postinstall.sh
