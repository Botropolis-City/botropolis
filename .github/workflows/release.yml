name: release

# Manual, and it publishes what CI already built rather than building again.
# The version comes from the VERSION file, so cutting a release is a commit that
# edits one line plus one button.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve and validate everything, but create nothing"
        type: boolean
        default: false

# contents: write to create the tag and the release.
# actions: read to list ci runs and download the artifact this publishes --
# without it the job fails with "Resource not accessible by integration", which
# testing the same gh commands with a personal token does not reproduce, because
# a personal token has more access than the workflow's does.
permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The acceptance tests that measure CPU and memory (item 226) need a quiet
  # machine, so no push runs them: the performance manager does, on demand
  # and before each release, and this does, before the tag. They hold the
  # budgets in performance/, with instructions counted where a runner has
  # the counters (item 209), and a dry run runs them too. The 600-district
  # stress city only reports here, because a shared runner varies too much
  # to hold its bars; the reference machine's quiet run gates it (item 305).
  performance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build dependencies for Ebitengine, and an X server
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev pkg-config xvfb
      - run: make test-performance

  release:
    needs: performance
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} from ${GITHUB_SHA}"

      - name: Refuse to release a version that already exists
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.v.outputs.version }}" | grep -q .; then
            echo "::error::v${{ steps.v.outputs.version }} is already tagged. Bump VERSION and CHANGELOG.md first."
            exit 1
          fi

      - name: Every file naming a version must agree
        run: tools/check-version

      - name: Find the CI run that built this commit
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(gh run list --workflow ci.yml --commit "${GITHUB_SHA}" \
                  --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "${id}" ] || [ "${id}" = "null" ]; then
            echo "::error::No successful ci run for ${GITHUB_SHA}. Push to main and let CI finish, then release again."
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # One artifact per architecture, each with its own SHA256SUMS. Each is
      # verified where it lands, before anything is moved, so a corrupted
      # download cannot be laundered by the flatten.
      - name: Download what CI built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh run download "${{ steps.run.outputs.id }}" --pattern 'botropolis-packages-*' --dir staging; then
            echo "::error::No botropolis-packages-* artifacts on run ${{ steps.run.outputs.id }} — they have probably expired. Re-run ci on this commit, then release again."
            exit 1
          fi
          found=$(find staging -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "${found}" -eq 0 ]; then
            echo "::error::Downloaded nothing."
            exit 1
          fi
          echo "architectures: ${found}"
          mkdir -p dist
          for d in staging/*/; do
            echo "verifying $(basename "$d")"
            ( cd "$d" && sha256sum -c SHA256SUMS )
            find "$d" -maxdepth 1 -type f ! -name SHA256SUMS -exec mv {} dist/ \;
          done
          # Each package again under a name without the version, so
          # /releases/latest/download/<name> is always the newest. The website's
          # install commands link those names; SHA256SUMS below covers them too.
          tools/release-aliases "${{ steps.v.outputs.version }}" dist
          ( cd dist && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS )
          ls -l dist/
          cat dist/SHA256SUMS

      - name: Take the release notes from the changelog
        run: |
          version="${{ steps.v.outputs.version }}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          cat release-notes.md

      - name: Dry run stops here
        if: inputs.dry_run
        run: |
          echo "Dry run for v${{ steps.v.outputs.version }}."
          echo "The version resolves, the artifact is present and the notes extract. Nothing created."

      # --target creates the tag itself, so the tag necessarily points at the
      # commit that was tested rather than at whatever a human tagged by hand.
      - name: Create the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --target "${GITHUB_SHA}" \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

      # The website links /releases/latest/download/<fixed name>. Prove those
      # links serve what was just released, byte for byte, rather than trusting
      # that "latest" moved.
      - name: Check latest/download serves this release
        if: ${{ !inputs.dry_run }}
        run: |
          version="${{ steps.v.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          bad=0
          for f in dist/*; do
            name=$(basename "$f")
            case "$name" in *"${version}"*|SHA256SUMS) continue ;; esac
            want=$(sha256sum < "$f" | cut -d' ' -f1)
            got=$(curl -fsSL --retry 5 --retry-delay 5 "${base}/${name}" | sha256sum | cut -d' ' -f1)
            if [ "$want" = "$got" ]; then
              echo "ok  ${name}"
            else
              echo "::error::${base}/${name} does not serve v${version}'s ${name}"
              bad=1
            fi
          done
          exit $bad

  # Wall time for the bar's tasks (item 91), once per release (item 104), on the
  # same runner kind every time. It reports and never gates: it runs beside the
  # release rather than after it, and its failure is not the release's. The
  # summary compares it with the previous release's bench.txt, and attach below
  # adds this one to the release once the release exists. A dry run benchmarks
  # and compares too, whatever the release job decides, and attaches nothing.
  bench:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build dependencies for Ebitengine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev pkg-config
      - name: Benchmark
        run: |
          set -o pipefail
          make bench | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt
      - name: The previous release's figures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          this="v$(tr -d '[:space:]' < VERSION)"
          prev=$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
            --limit 20 --json tagName --jq '.[].tagName' | grep -vxF "${this}" | head -n 1 || true)
          if [ -n "${prev}" ] && gh release download "${prev}" --repo "${GITHUB_REPOSITORY}" --pattern bench.txt --dir previous; then
            echo "compared with ${prev}" > previous/source
          else
            echo "no earlier release has a bench.txt, so nothing is compared" > previous.missing
          fi
      - name: Summary
        run: |
          {
            echo "## The bar's tasks, wall time"
            echo
            echo "Reported, never gating. The acceptance tests gate on steps, ticks and work."
            echo
            echo '```'
            if [ -f previous/bench.txt ]; then
              cat previous/source
              go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e previous/bench.txt bench.txt
            else
              cat previous.missing
              grep -E '^Benchmark' bench.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  attach:
    needs: [release, bench]
    if: ${{ !inputs.dry_run }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench
      - name: Attach the figures to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" bench.txt --repo "${GITHUB_REPOSITORY}"

  # The APT and RPM repositories at pkg.botropolis.city, rebuilt with the
  # release just published. A failure here leaves the release itself intact;
  # run the packages workflow by hand once it is fixed.
  packages:
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/packages.yml
    secrets: inherit
