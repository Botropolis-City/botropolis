name: packages

# Builds the signed APT and RPM repositories from the last few releases, and
# the Homebrew tap for the latest, and publishes them to pkg.botropolis.city. The release workflow calls this after
# every release; run it by hand to republish, for example after a key change.
#
# Secrets: PKG_SIGNING_KEY (the armored secret key; its master copy is in
# 1Password), R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 token scoped
# to the botropolis-packages bucket, object read and write only).
on:
  workflow_dispatch:
    inputs:
      new_tap:
        description: Start the Homebrew tap's history afresh (once, for the first publish)
        type: boolean
        default: false
      dry_run:
        description: Build and install-test everything, upload nothing
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

env:
  PKG_HOST: https://pkg.botropolis.city
  PACKAGES_BUCKET: botropolis-packages
  R2_ENDPOINT: https://84f3dbea51f616e22dee2f6a506bc172.r2.cloudflarestorage.com
  RELEASES: "3"

jobs:
  # The tap is a bare git repository read over git's static HTTP protocol,
  # which is all a bucket can serve. Its formula builds from the release's
  # source archive, so nothing a Mac downloads is an unsigned binary.
  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A real run builds the latest release. A dry run builds this commit at
      # its VERSION, so what it install-tests is the code about to be released.
      - name: Build the tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            version=$(cat VERSION)
            export SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          else
            latest=$(gh release list -R "${GITHUB_REPOSITORY}" --limit 1 --json tagName -q '.[0].tagName')
            version=${latest#v}
          fi
          tools/build-brew-tap ${{ inputs.new_tap && '--new' || '' }} "${version}" .brewtap/brew
          echo "${version}" > .brewtap/version
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install from the built tap on Linux
        run: testing/acceptance/packages/brew-test.sh --tap .brewtap/brew "${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: brew-tap
          path: .brewtap
          include-hidden-files: true
          if-no-files-found: error

  # Nothing in the working arrangement runs macOS (item 80); this is where
  # the formula is built and tested on Apple silicon and on Intel before it
  # is published.
  tap-macos:
    needs: tap
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: brew-tap
          path: .brewtap
      - name: Install from the built tap on macOS, and run the daemon under launchd
        run: testing/acceptance/packages/brew-test.sh --native --tap .brewtap/brew "$(cat .brewtap/version)"

  publish:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the last releases' packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pkgrepo-in
          for tag in $(gh release list -R "${GITHUB_REPOSITORY}" --limit "${RELEASES}" --json tagName -q '.[].tagName'); do
            gh release download "$tag" -R "${GITHUB_REPOSITORY}" --dir .pkgrepo-in \
              --pattern 'botropolis_*_*.deb' --pattern 'botropolis-*-*.rpm'
          done
          ls -l .pkgrepo-in
          latest=$(gh release list -R "${GITHUB_REPOSITORY}" --limit 1 --json tagName -q '.[0].tagName')
          echo "VERSION=${latest#v}" >> "$GITHUB_ENV"

      - name: Build and sign the repositories
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          docker build -q -t botropolis-pkgrepo packaging/repo
          docker run --rm -e PKG_SIGNING_KEY -v "$PWD":/work -u "$(id -u):$(id -g)" \
            botropolis-pkgrepo tools/build-package-repos .pkgrepo-in .pkgrepo 2> >(grep -v GPG_TTY >&2)

      # Before anything is uploaded: install from exactly this tree, with
      # signature checks on, in clean Debian and Fedora containers.
      - name: Install from the built repositories
        run: testing/acceptance/packages/install-test.sh --repo .pkgrepo "${VERSION}"

      # Packages first, indexes last, so a client never reads an index naming
      # a file that is not there yet. Packages never change under a name, so
      # they cache forever; indexes for five minutes.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          s3() { aws s3 "$@" --endpoint-url "${R2_ENDPOINT}" --only-show-errors; }
          dest="s3://${PACKAGES_BUCKET}"
          s3 cp --recursive .pkgrepo/deb/pool "$dest/deb/pool" --cache-control "public, max-age=31536000, immutable"
          s3 cp --recursive .pkgrepo/rpm "$dest/rpm" --exclude 'repodata/*' --cache-control "public, max-age=31536000, immutable"
          s3 cp --recursive .pkgrepo/rpm/repodata "$dest/rpm/repodata" --cache-control "public, max-age=300"
          s3 cp --recursive .pkgrepo/deb/dists "$dest/deb/dists" --cache-control "public, max-age=300"
          for f in botropolis.asc botropolis.sources botropolis.repo; do
            s3 cp ".pkgrepo/$f" "$dest/$f" --cache-control "public, max-age=300"
          done

      - name: Install from pkg.botropolis.city
        run: testing/acceptance/packages/install-test.sh --base "${PKG_HOST}" "${VERSION}"

  # Its own job, so a tap that fails does not hold back APT and RPM.
  publish-tap:
    needs: tap-macos
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: brew-tap
          path: .brewtap

      # Packs first, refs last, so a client never reads a ref naming a pack
      # that is not there yet. A pack is named by its contents, so it caches
      # forever; refs for five minutes.
      - name: Upload the tap to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          s3() { aws s3 "$@" --endpoint-url "${R2_ENDPOINT}" --only-show-errors; }
          dest="s3://${PACKAGES_BUCKET}/brew"
          s3 cp --recursive .brewtap/brew/objects/pack "$dest/objects/pack" --cache-control "public, max-age=31536000, immutable"
          s3 cp --recursive .brewtap/brew "$dest" --exclude 'objects/pack/*' --exclude 'hooks/*' --cache-control "public, max-age=300"

      - name: Install from the published tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list -R "${GITHUB_REPOSITORY}" --limit 1 --json tagName -q '.[0].tagName')
          testing/acceptance/packages/brew-test.sh --base "${PKG_HOST}" "${latest#v}"
