name: macos-shortcut

# Item 95: the global shortcut on a real macOS desktop. Nothing in the
# working arrangement is a Mac, and Apple's licence allows macOS VMs only
# on Apple hardware, so this is where the Carbon hot key and coming
# forward are tried. The hosted image grants Accessibility to bash and
# osascript, so System Events can press the combination from another
# application. By hand only, never on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortcut:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The display and its scale
        run: system_profiler SPDisplaysDataType
      - name: The hot key and coming forward
        env:
          BOTROPOLIS_FRAMES: ${{ runner.temp }}/frames
        run: go test -count=1 -v -timeout 10m -run 'OnMacOS' ./testing/integration/hotkey/
      # The settings row in the city's own live window, as a Mac shows it,
      # for Aria to judge: off, asking, a combination saved, and an
      # Option-only one refused. The city records its own frames too, but
      # the screencaptures are the frames, since they show macOS's scaling
      # and fonts. One key every two seconds; a capture every second.
      - name: Build the city with the frame tooling
        run: go build -tags devtools -o "$RUNNER_TEMP/botropolis" ./cmd/botropolis
      - name: The settings row in a live window
        env:
          FRAMES: ${{ runner.temp }}/frames
          KEYS: s,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,arrowdown,enter,cmd+shift+k,enter,alt+f
        run: |
          mkdir -p "$FRAMES/row/live" "$FRAMES/row/rendered" "$RUNNER_TEMP/home/.claude/projects"
          "$RUNNER_TEMP/botropolis" city --home "$RUNNER_TEMP/home" --socket "$RUNNER_TEMP/none.sock" \
            --config "$RUNNER_TEMP/config.toml" --record "$FRAMES/row/rendered" --fps 1 --seconds 40 --keys "$KEYS" &
          city=$!
          i=0
          while kill -0 "$city" 2>/dev/null; do
            screencapture -x "$FRAMES/row/live/$(printf %03d "$i").png"
            i=$((i + 1))
            sleep 1
          done
          wait "$city"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-${{ matrix.runner }}
          path: ${{ runner.temp }}/frames
          if-no-files-found: warn
