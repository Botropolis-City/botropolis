name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This is also the build check for a pull request. It compiles everything for
  # the runner's architecture and runs the suite, which is all a branch needs to
  # show the build is not broken. The packaging matrix below is for main only.
  test-lint:
    runs-on: ubuntu-latest
    steps:
      # The whole history, tags included: make version-check compares what
      # 1.0.0 promises with the last release tag, and fails without one
      # (item 149).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Go is pinned by go.mod's toolchain line and golangci-lint by
      # tools/lint/go.mod (item 103), and make lint builds and checks both, so
      # this job and every machine lint with the same versions.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      # pkg/render imports Ebitengine. The build itself needs no cgo -- GL and
      # X11 are reached through dlopen -- but golangci-lint and the tests still
      # want the headers present to analyse the package.
      - name: Build dependencies for Ebitengine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev pkg-config
      # Every shell the integration supports. The shell test fails rather than
      # skips a missing one under CI, so this list is enforced.
      - name: Shells for the shell integration test
        run: sudo apt-get install -y zsh fish bash-completion
      # The X server and window manager the global shortcut is tested
      # against (item 84). That test fails rather than skips without them
      # under CI, because it is the whole proof the X11 part works.
      - name: An X server and i3 for the global shortcut test
        run: sudo apt-get install -y xvfb i3-wm
      # The Makefile's 40m is for loaded local machines (item 131). Here the
      # acceptance suite took 380-540 s through 2026-10-22, and past 600 s
      # once item 197 added a two-minute measuring test, which the old 10m
      # killed with no test hung (item 202). A timeout here is a hang
      # detector, not a performance budget: 20m is about twice what the
      # suite takes, so a hang still fails well inside the job.
      - run: make test lint
        env:
          ACCEPTANCE_TIMEOUT: 20m

  # Nothing in the working arrangement runs macOS (item 80), so this is the
  # only place the darwin code runs: the netstat attached probe, open, pbcopy
  # and osascript, on Apple silicon and on Intel. Unit tests only -- no window
  # is opened.
  test-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-unit
      # Item 200: the first-launch ingest's background priority against item
      # 138's inversion, beside two busy processes per core. Alone in its own
      # step, since its busy loops starve other tests. Set the variable to
      # "all" to measure every policy item 200 weighed.
      - name: Background priority against item 138's inversion
        env:
          BOTROPOLIS_DARWIN_PRIORITY_MATRIX: shipped
        run: go test -count=1 -v -timeout 30m -run '^TestStateChangeDuringBackfillOnDarwin$' ./pkg/daemon/
      # macOS's own bash (3.2) and zsh, which are what a Mac user has, and fish;
      # bash-completion is Homebrew's 3.2-compatible one, which bash completion
      # on a Mac needs.
      - name: Shell integration and completion on macOS's shells
        run: |
          brew install fish bash-completion
          go test -count=1 ./testing/integration/packaging/

  # Everything the release publishes is built here, once per architecture, on a
  # commit that has already passed the gate. The release workflow downloads these
  # artifacts rather than building again, so what ships is what was tested.
  #
  # main only. A pull request gets one build from test-lint above, which is
  # enough to show it still compiles; there is no reason to package four formats
  # twice over on a branch.
  package:
    needs: test-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      # No cross toolchain and no emulation: the Makefile builds with
      # CGO_ENABLED=0, so another architecture is a plain go build.
      - name: Package for ${{ matrix.goarch }}
        run: make tarball package checksums GOARCH=${{ matrix.goarch }}
      - name: Install rpm so all three packages can be read
        run: sudo apt-get install -y rpm
      # One nfpm config produces all three, so they should agree by construction.
      # rpm is not installed on an Arch developer machine, so this is the only
      # place all three can actually be compared.
      - name: The three packages must carry the same files
        run: make packages-check
      - name: Show what was built
        run: |
          ls -l dist/
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: botropolis-packages-${{ matrix.goarch }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error
