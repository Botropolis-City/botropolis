name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This is also the build check for a pull request. It compiles everything for
  # the runner's architecture and runs the suite, which is all a branch needs to
  # show the build is not broken. The packaging matrix below is for main only.
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned, not read from go.mod. go.mod says 1.27, which floats, and
      # golangci-lint v2.13.2 cannot read go1.27.2's export data ("export data
      # version 5 is greater than maximum supported version 4"). Move this and
      # the golangci-lint version together.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      # pkg/render imports Ebitengine. The build itself needs no cgo -- GL and
      # X11 are reached through dlopen -- but golangci-lint and the tests still
      # want the headers present to analyse the package.
      - name: Build dependencies for Ebitengine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev pkg-config
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
      - run: make test lint

  # Everything the release publishes is built here, once per architecture, on a
  # commit that has already passed the gate. The release workflow downloads these
  # artifacts rather than building again, so what ships is what was tested.
  #
  # main only. A pull request gets one build from test-lint above, which is
  # enough to show it still compiles; there is no reason to package four formats
  # twice over on a branch.
  package:
    needs: test-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      # No cross toolchain and no emulation: the Makefile builds with
      # CGO_ENABLED=0, so another architecture is a plain go build.
      - name: Package for ${{ matrix.goarch }}
        run: make tarball package checksums GOARCH=${{ matrix.goarch }}
      - name: Install rpm so all three packages can be read
        run: sudo apt-get install -y rpm
      # One nfpm config produces all three, so they should agree by construction.
      # rpm is not installed on an Arch developer machine, so this is the only
      # place all three can actually be compared.
      - name: The three packages must carry the same files
        run: make packages-check
      - name: Show what was built
        run: |
          ls -l dist/
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: botropolis-packages-${{ matrix.goarch }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error
