name: layers
description: One city seen through each of its views, by day and by night.
clock: "15:00"
mcp: [tracker, weather]
usage: {session: 52, weekly: 67, models: {Opus: 33}}
sessions:
  - {ref: tidepool/units-from-tracker, state: working, ago: 20s, started: 1h10m, context: 38%, prs: [open]}
  - {ref: tidepool/review-loader-and-docs, state: needs-you, ago: 7m, started: 3h50m, context: 72%}
  - {ref: lanternfish/list-race, state: working, ago: 40s, started: 30m, context: 91%, errors: 2}
  - {ref: lanternfish/status-filter, state: resting, ago: 5h, prs: [merged]}
  - {ref: kiln/line-numbers-like-tidepool, state: working, ago: 1m, started: 2h30m, context: 48%}
  - {ref: kiln/json-report, state: unattended, ago: 3m, started: 1h50m, context: 62%}
  - {ref: quillmark/fix-code-spans, state: working, ago: 2m, started: 4h30m, context: 24%}
  - {ref: quillmark/compare-kiln-packaging, state: resting, ago: 2d}
  - {ref: beacon/conditions-line, state: working, ago: 30s, started: 3h10m, context: 55%}
  - {ref: orchard/triploid-design, state: needs-you, ago: 12m, started: 6h20m, context: 31%}
  - {ref: orchard/parallel-review, state: working, ago: 15s, started: 5h40m, context: 79%}
shots:
  - name: views
    title: Six ways to read the city
    description: The lens key, then each lens in turn -- attention, work, cost, capacity, health and connections -- then night and day.
    record: {seconds: 24.5, fps: 30}
    script:
      - {at: 0.5, key: V}
      - {at: 3.0, key: Digit2}
      - {at: 5.5, key: Digit3}
      - {at: 8.0, key: Digit4}
      - {at: 10.5, key: Digit5}
      - {at: 13.0, key: Digit6}
      - {at: 15.5, key: Digit1}
      - {at: 17.5, key: N}
      - {at: 21.0, key: N}
  - name: attention
    title: Attention
    description: Which sessions are waiting for you, and which are working.
    view: attention
  - name: spend
    title: Spend
    description: Where the money went.
    view: spend
  - name: pressure
    title: Pressure
    description: Who is about to compact.
    view: pressure
  - name: staleness
    title: Staleness
    description: What has gone quiet.
    view: staleness
  - name: servers
    title: Servers
    description: What breaks if a server goes down.
    view: servers
  - name: traffic
    title: Traffic
    description: Which repos talk to each other.
    view: traffic
  - name: models
    title: Models
    description: Where the models are.
    view: models
  - name: fan-out
    title: Fan-out
    description: Which sessions spawn armies.
    view: fan-out
  - name: health
    title: Health
    description: What is broken, and what shipped.
    view: health
  - name: groups
    title: Groups
    description: Whose move each piece of work is.
    view: groups
  - name: day
    title: The same city by day
    description: No view, nothing selected, interface hidden.
    keys: [h]
    group_lines: false
  - name: night
    title: The same city at night
    description: Lit windows mark the sessions that are awake.
    clock: "23:00"
