name: layers
description: One city seen through each of its views, by day and by night.
clock: "15:00"
mcp: [tracker, weather]
usage: {session: 52, weekly: 67, models: {Opus: 33}}
sessions:
  - {ref: tidepool/units-from-tracker, state: working, ago: 20s, context: 38%, prs: [open]}
  - {ref: tidepool/review-loader-and-docs, state: needs-you, ago: 7m, context: 72%}
  - {ref: lanternfish/list-race, state: working, ago: 40s, context: 91%, errors: 2}
  - {ref: lanternfish/status-filter, state: resting, ago: 5h, prs: [merged]}
  - {ref: kiln/line-numbers-like-tidepool, state: working, ago: 1m, context: 48%}
  - {ref: kiln/json-report, state: unattended, ago: 3m, context: 62%}
  - {ref: quillmark/fix-code-spans, state: working, ago: 2m, context: 24%}
  - {ref: quillmark/compare-kiln-packaging, state: resting, ago: 2d}
  - {ref: beacon/conditions-line, state: working, ago: 30s, context: 55%}
  - {ref: orchard/triploid-design, state: needs-you, ago: 12m, context: 31%}
  - {ref: orchard/parallel-review, state: working, ago: 15s, context: 79%}
shots:
  - name: views
    title: Six ways to read the city
    description: The lens key, then each lens in turn -- attention, work, cost, capacity, health and connections -- then night and day.
    record: {seconds: 24.5, fps: 30}
    script:
      - {at: 0.5, key: V}
      - {at: 3.0, key: Digit2}
      - {at: 5.5, key: Digit3}
      - {at: 8.0, key: Digit4}
      - {at: 10.5, key: Digit5}
      - {at: 13.0, key: Digit6}
      - {at: 15.5, key: Digit1}
      - {at: 17.5, key: N}
      - {at: 21.0, key: N}
  - name: cost
    title: Cost
    description: What each session has spent, and on which models.
    keys: [Digit3]
  - name: capacity
    title: Capacity
    description: How full each session's context is, and how many subagents it has running.
    keys: [Digit4]
  - name: night
    title: The same city at night
    description: Lit windows mark the sessions that are awake.
    clock: "23:00"
