  - {ref: orchard/layout-reentrancy, project: copperleaf, state: working, ago: 30s, started: 7h45m, title: Copperleaf planner, context: 68%}
  - {ref: beacon/shared-classifier, project: millrace, state: unattended, ago: 4m, started: 8h20m, title: Millrace nightly, context: 57%}
  - {ref: kiln/hold-time-sampling, project: thistledown, state: resting, ago: 2d, started: 2d3h, title: Thistledown import}
  - {ref: lanternfish/status-filter, project: thistledown, state: working, ago: 2m, started: 10h30m, title: Thistledown search, prs: [open], context: 35%}
