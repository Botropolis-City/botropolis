groups:
  - [Driftwood ingest, Driftwood schema, Saltmarsh API]
shots:
  - name: walk-start
    title: Tidy up, the first card
    description: Start clean, Walk through it, or Later.
    keys: [g, t]
  - name: walk-group
    title: Tidy up, a group's card
    description: The strongest group, its members listed, the camera on its line.
    keys: [g, t, enter]
  - name: walk-quiet
    title: Tidy up, the quiet card
    description: The sessions in no group quiet for a week, answered pack them up.
    keys: [g, t, enter, n]
  - name: close-group
    title: Closing a group
    description: Close group on City Hall's board packs the group's sessions into the depot as a convoy.
    daemon: true
    record: {seconds: 16, fps: 10}
    formats: [mp4, gif]
    script:
      - {at: 0, point_at: "district:driftwood", over: 1}
      - {at: 1, wheel: 3, over: 1.5}
      - {at: 3, key: g}
      - {at: 4, key: delete}
      - {at: 5, key: delete}
      - {at: 6, key: escape}
      - {at: 7, pan_to: "district:tidepool", over: 5}
  - name: walk
    title: Tidy up, end to end
    description: Walk through it, keep the group, pack up the quiet sessions, and the journal.
    daemon: true
    keys: [g, t, enter, enter, enter, escape]
    record: {seconds: 18, fps: 10}
    formats: [mp4, gif]
