name: workshop
description: A working afternoon across four projects, with the tracker and the weather wired in.
clock: "14:00"
mcp: [tracker, weather]
usage: {session: 46, weekly: 58, models: {Opus: 21}}
sessions:
  - ref: tidepool/units-from-tracker
    state: working
    context: 34%
    ago: 30s
    prs: [open]
  - ref: tidepool/review-loader-and-docs
    state: needs-you
    context: 72%
    ago: 6m
  - ref: lanternfish/list-race
    state: working
    context: 91%
    ago: 2m
    errors: 1
  - ref: lanternfish/status-filter
    state: resting
    ago: 5h
    prs: [merged]
  - ref: kiln/line-numbers-like-tidepool
    state: working
    context: 48%
    ago: 1m
  - ref: kiln/empty-log-from-tracker
    state: resting
    ago: 26h
    prs: [merged]
  - ref: quillmark/fix-code-spans
    state: unattended
    context: 24%
    ago: 3m
  - ref: quillmark/compare-kiln-packaging
    state: resting
    ago: 2d
  - project: quillmark
    state: empty
    title: Theme gallery
shots:
  - name: overview
    title: A working afternoon
    description: Four projects; sessions working, waiting, running unattended and parked, with the plan's usage on the river.
  - name: needs-you
    title: The session that needs you
    description: Tab jumps to the next session waiting on an answer and opens its card.
    keys: [tab]
  - name: power
    title: Where the tokens go
    description: The power plant's breakdown of the last day's tokens and spend.
    keys: [x]
  - name: flat
    title: The workshop from above
    description: The same city in the top-down projection.
    projection: top
  - name: tour
    title: A tour of the workshop
    description: Point at the busiest building and open its card, read its summary, open the power plant, then the sidebar.
    record: {seconds: 26, fps: 30}
    script:
      - {at: 0.5, point_at: "Race between list and checkout", over: 1.5}
      - {at: 2.2, wheel: 3, over: 2}
      - {at: 4.6, click: true}
      - {at: 7.0, key: I}
      - {at: 10.0, key: Escape}
      - {at: 10.5, key: F}
      - {at: 12.5, point_at: plant, over: 1.2}
      - {at: 14.0, click: true}
      - {at: 18.0, key: Escape}
      - {at: 18.5, key: B}
      - {at: 22.5, key: B}
      - {at: 23.0, pan_to: "district:quillmark", over: 1.2}
      - {at: 24.5, key: F}
