  - {project: saltmarsh, state: empty, title: Saltmarsh tide gauges}
  - {project: ferrylight, state: empty, title: Ferrylight timetable}
shots:
  - name: overview
    title: A busy metropolis
    description: Twelve districts in the early evening, a team camp, trains for every model, and the day's finished sessions resting on their lots.
  - name: hero
    title: The metropolis, without the chrome
    description: A dozen districts, interface hidden.
    keys: [h]
    group_lines: false
  - name: plain
    title: The metropolis, plain
    description: The same city with the scenery dropped, for reading at a glance.
    detail: plain
  - name: sidebar
    title: Every session in a list
    description: The sidebar lists every session by district and state.
    keys: [b]
  - name: flyover
    title: Flying over the metropolis
    description: Zoom into the team camp and open a card, glide across the districts, turn, and pull back out.
    record: {seconds: 22, fps: 30}
    script:
      - {at: 0.5, point_at: "district:driftwood", over: 1.5}
      - {at: 2.0, wheel: 3, over: 2.5}
      - {at: 5.0, point_at: "Driftwood schema", over: 1}
      - {at: 6.2, click: true}
      - {at: 9.0, key: Escape}
      - {at: 9.5, pan_to: "district:saltmarsh", over: 2}
      - {at: 12.0, pan_to: "district:lanternfish", over: 2.5}
      - {at: 15.0, key: R}
      - {at: 17.5, key: F}
