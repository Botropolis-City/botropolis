  - {ref: beacon/shared-classifier, state: resting, ago: 20h}
  - {ref: tidepool/units-from-tracker, project: driftwood, state: working, ago: 2m, title: Driftwood ingest, team: harbor, agent: lead, context: 62%}
  - {ref: kiln/json-report, project: driftwood, state: working, ago: 1m, title: Driftwood schema, team: harbor, agent: schema, context: 90%}
  - {ref: lanternfish/list-race, project: saltmarsh, state: working, ago: 3m, title: Saltmarsh API, team: harbor, agent: api, context: 44%}
