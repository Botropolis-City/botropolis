groups:
  - [Driftwood ingest, Driftwood schema, Saltmarsh API]
shots:
  - name: hall
    title: City Hall and its card
    description: City Hall stands on the plaza once Claude Code has computed your statistics; pointing at it shows a card that says how many sessions and messages, your busiest hour and each model's share.
    record: {seconds: 5, fps: 10}
    poster_at: 5
    formats: [mp4, webm]
    script:
      - {at: 0, pan_to: hall, over: 1.5}
      - {at: 0, wheel: 3, over: 1.5}
      - {at: 2.0, point_at: hall, over: 1.2}
  - name: clinic
    title: The clinic
    description: The clinic lists who needs you, then who is in trouble; 1 to 9 jumps to a row.
    keys: [a]
  - name: board
    title: City Hall's groups board
    description: City Hall's board lists every group; F2 renames the chosen group, Delete Delete closes it, and t walks a tidy-up.
    keys: [g]
  - name: board-rename
    title: Renaming a group on City Hall's board
    description: F2 on City Hall's board renames the chosen group, and the line takes the new name at once.
    daemon: true
    record: {seconds: 12, fps: 15}
    poster_at: 7.8
    formats: [mp4, webm]
    script:
      - {at: 0.5, key: g}
      - {at: 2.0, key: F2}
      - {at: 2.50, key: backspace}
      - {at: 2.65, key: backspace}
      - {at: 2.80, key: backspace}
      - {at: 2.95, key: backspace}
      - {at: 3.10, key: backspace}
      - {at: 3.25, key: backspace}
      - {at: 3.40, key: backspace}
      - {at: 3.55, key: backspace}
      - {at: 3.70, key: backspace}
      - {at: 3.85, key: backspace}
      - {at: 4.00, key: backspace}
      - {at: 4.15, key: backspace}
      - {at: 4.30, key: backspace}
      - {at: 4.45, key: backspace}
      - {at: 4.60, key: backspace}
      - {at: 4.75, key: backspace}
      - {at: 4.90, key: backspace}
      - {at: 5.05, key: backspace}
      - {at: 5.20, key: backspace}
      - {at: 5.35, key: backspace}
      - {at: 5.6, key: "H"}
      - {at: 5.9, key: "a"}
      - {at: 6.2, key: "r"}
      - {at: 6.5, key: "b"}
      - {at: 6.8, key: "o"}
      - {at: 7.1, key: "r"}
      - {at: 8.0, key: enter}
  - name: menu
    title: The action menu, from its button
    description: The action menu hangs just under the button it opened from, with a notch pointing at it; the button stays pressed with its chevron turned up, and the column it opened lights.
    record: {seconds: 8, fps: 15}
    poster_at: 7.5
    formats: [mp4, webm]
    script:
      - {at: 0, pan_to: "Driftwood schema", over: 1.5}
      - {at: 0, wheel: 2, over: 1.5}
      - {at: 0.5, point_at: "Driftwood schema", over: 1.2}
      - {at: 2.0, click: true}
      - {at: 3.5, key: space}
      - {at: 5.5, key: g}
  - name: menu-space
    title: The action menu, from space
    description: Space opens the action menu under the Session button.
    record: {seconds: 5, fps: 10}
    poster_at: 5
    formats: [mp4, webm]
    script:
      - {at: 0, pan_to: "Driftwood schema", over: 1.5}
      - {at: 0, wheel: 2, over: 1.5}
      - {at: 0.5, point_at: "Driftwood schema", over: 1.2}
      - {at: 2.0, click: true}
      - {at: 3.5, key: space}
  - name: menu-rightclick
    title: The action menu, by right-click
    description: A right-click still opens the action menu at the pointer.
    record: {seconds: 5, fps: 10}
    poster_at: 5
    formats: [mp4, webm]
    script:
      - {at: 0, pan_to: "Driftwood schema", over: 1.5}
      - {at: 0, wheel: 2, over: 1.5}
      - {at: 0.5, point_at: "Driftwood schema", over: 1.2}
      - {at: 2.5, right_click: true}
  - name: keys
    title: Hold e to see every key
    description: While e is held, every control on screen that a key also does wears that key, drawn as a key cap.
    record: {seconds: 7, fps: 10}
    poster_at: 6
    formats: [mp4, webm]
    script:
      - {at: 0, pan_to: "Driftwood schema", over: 1.5}
      - {at: 0, wheel: 2, over: 1.5}
      - {at: 0.5, point_at: "Driftwood schema", over: 1.2}
      - {at: 2.0, click: true}
      - {at: 4.0, hold: e, for: 3}
