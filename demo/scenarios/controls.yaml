name: controls
description: The metropolis with its statistics, so City Hall stands, for the controls added in 0.5.0 — the clinic, City Hall's board, the action menu and every key while e is held (item 362).
clock: "18:30"
mcp: [tracker, weather]
usage: {session: 71, weekly: 83, models: {Opus: 64}}
