name: hamlet
description: One person, two projects, late in the evening.
clock: "22:30"
mcp: [weather]
usage: {session: 22, weekly: 31}
sessions:
  - ref: tidepool/fix-table-timezone
    state: working
    context: 58%
    ago: 1m
  - ref: tidepool/what-is-phase
    state: resting
    ago: 3h
  - ref: beacon/conditions-line
    state: needs-you
    context: 83%
    ago: 4m
shots:
  - name: overview
    title: A quiet hamlet
    description: Two projects late at night, one session working and one waiting on an answer.
  - name: hero
    title: The hamlet, without the chrome
    description: The same night with the interface hidden.
    keys: [h]
    group_lines: false
  - name: drift
    title: Looking in on the hamlet
    description: Zoom in on the session that is working, turn the camera, then find the one waiting on an answer.
    record: {seconds: 14, fps: 30}
    script:
      - {at: 0.5, point_at: "Tide table in station time", over: 1.5}
      - {at: 2.0, wheel: 3, over: 2.5}
      - {at: 5.0, key: R}
      - {at: 7.0, key: Tab}
      - {at: 10.5, key: Escape}
      - {at: 11.0, key: F}
