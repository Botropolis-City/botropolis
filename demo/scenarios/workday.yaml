name: workday
description: A morning compressed into forty seconds, sessions arriving, waiting, merging and leaving.
clock: "09:30"
mcp: [tracker, weather]
usage: {session: 8, weekly: 34}
usage_changes:
  - {at: 12s, session: 24, weekly: 36}
  - {at: 24s, session: 41, weekly: 39}
  - {at: 36s, session: 57, weekly: 41}
sessions:
  - ref: tidepool/fix-table-timezone
    state: working
    branch: fix/station-time
    context: 62%
    ago: 30s
    started: 50m
    prs: [open]
    changes:
      - {at: 14s, prs: [merged]}
      - {at: 24s, state: needs-you}
  - ref: lanternfish/list-race
    state: needs-you
    context: 88%
    ago: 2m
    started: 1h25m
    changes:
      - {at: 6s, state: working}
      - {at: 20s, errors: 1}
  - ref: kiln/hold-time-sampling
    state: working
    branch: fix/station-time
    context: 41%
    ago: 1m
    started: 50m
    leave: 30s
  - ref: quillmark/drafts-and-changelog
    state: working
    arrive: 4s
    replay: {over: 20s, context: 64%}
    prs: [open]
    changes:
      - {at: 28s, prs: [merged]}
  - ref: orchard/parallel-review
    state: working
    arrive: 10s
    replay: {over: 22s, context: 81%}
  - ref: beacon/battery-threshold
    state: working
    arrive: 16s
    replay: {over: 14s, context: 47%}
    leave: 34s
  - ref: tidepool/what-is-phase
    state: resting
    ago: 20h
  - ref: kiln/empty-log-from-tracker
    state: resting
    ago: 2d
groups:
  - [Tide table in station time, Hold time ignores the sample rate]
shots:
  - name: morning
    title: A morning in forty seconds
    description: Sessions arrive by boat, wait on answers, merge pull requests and rest on their own lots when they finish.
    record: {seconds: 40, fps: 30}
    timeline: true
  - name: start
    title: The start of the morning
    description: Three sessions at work before the others arrive.
