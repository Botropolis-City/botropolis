project: tidepool
sessions:
  - label: fix-table-timezone
    title: Tide table in station time
    model: sonnet
    budget_usd: 0.60
    visual: multi-turn
    prompts:
      - "`go run . table brackwater 2026-01-15` starts at 13:00 instead of 00:00. Can you work out why? Don't change anything yet."
      - "Makes sense. Fix it so the table covers midnight to midnight in the station's own timezone, and add a test that would have caught it."
      - "What happens on a day when the clocks change, like 2026-04-05 at Brackwater? Make sure the table handles a 23- or 25-hour day sensibly and test that too."
  - label: what-is-phase
    title: What phase is measured from
    model: haiku
    budget_usd: 0.15
    visual: quick
    prompts:
      - "In internal/tide/predict.go, what is a constituent's Phase measured relative to? A short answer is fine."
  - label: units-from-tracker
    title: Heights in feet
    model: sonnet
    budget_usd: 0.80
    visual: mcp
    prompts:
      - "Use the tracker MCP server to list the open tidepool issues, then pick up TIDE-16 (heights in feet). Implement it with tests, run go test ./..., then add a comment on TIDE-16 summarising the change and close it."
  - label: borrow-beacon-report-style
    title: Report style from beacon
    model: sonnet
    budget_usd: 0.40
    visual: subagents
    prompts:
      - "Use the Agent tool once, in the foreground (do not run it in the background), to have a subagent read /home/demo/src/beacon/bin/beacon-report, /home/demo/src/beacon/lib/common.sh and /home/demo/src/beacon/README.md and describe how beacon lays out its daily report. Wait for it, then tell me in three sentences whether tidepool's `table` output should follow the same layout. Don't change any files."
  - label: review-loader-and-docs
    title: Constituent names and docs
    model: sonnet
    budget_usd: 0.70
    visual: subagents
    prompts:
      - "Use the Agent tool to run two subagents in parallel: one should investigate TIDE-15 (unknown constituent names silently ignored) in internal/tide/stations.go and propose a fix, the other should read the loader and data/ and draft the README section TIDE-17 asks for. When both are back, apply the fix with a test and add the README section."
  - label: tide-team
    title: Ask a teammate about kiln's reader
    model: haiku
    budget_usd: 1.00
    visual: team
    team: true
    prompts:
      - "Spawn one teammate named reader, on the haiku model, using the Agent tool with the name reader. Ask it to read /home/demo/src/kiln/kiln/reader.py and send you, with SendMessage, a two-sentence summary of how kiln reports a bad line in a log. When its message arrives, thank it with one SendMessage, then tell me the summary and stop."
